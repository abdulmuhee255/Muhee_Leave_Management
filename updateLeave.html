<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Update Leave</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fc;color:#1e293b;font:15px Segoe UI,Arial,sans-serif}
header{background:linear-gradient(120deg,#172554,#2563eb);color:white;text-align:center;padding:28px 15px}
header h1{margin:0;font-size:30px}header p{margin:8px 0 0;color:#dbeafe}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;background:white;padding:13px;border-bottom:1px solid #e2e8f0}
nav a{padding:9px 12px;border-radius:8px;text-decoration:none;color:#334155;font-size:13px;font-weight:650}nav a:hover,nav a.active{background:#eff6ff;color:#2563eb}
main{max-width:1000px;width:calc(100% - 30px);margin:30px auto 50px}.card{background:white;padding:28px;border:1px solid #e2e8f0;border-radius:17px;box-shadow:0 10px 30px #0f172a0c}
h2{color:#172554;margin:0 0 8px}.sub{color:#64748b;margin:0 0 22px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px}.menu{display:block;padding:20px;border:1px solid #e2e8f0;border-radius:13px;text-decoration:none;color:#1e293b;font-weight:700}.menu:hover{background:#f8fbff;border-color:#93c5fd}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{display:flex;flex-direction:column;gap:7px}label{font-size:13px;font-weight:700;color:#334155}
input,select,textarea{padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;width:100%;background:white}textarea{min-height:90px}
button,.btn{border:0;border-radius:9px;padding:11px 16px;background:#2563eb;color:white;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;font-size:13px}.secondary{background:#eaf0f8;color:#334155}.danger{background:#dc2626}.success{background:#0f766e}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.tablewrap{overflow:auto;border:1px solid #e2e8f0;border-radius:10px;margin-top:18px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:12px;border-bottom:1px solid #e2e8f0;text-align:left;font-size:13px}th{background:#eff6ff;color:#1e3a8a}tr:last-child td{border:0}.msg{display:none;background:#eff6ff;color:#1e40af;padding:11px;border-radius:8px;margin-top:12px;font-size:13px}
footer{text-align:center;color:#94a3b8;font-size:12px;padding:0 15px 25px}@media(max-width:600px){.form{grid-template-columns:1fr}.card{padding:20px}header h1{font-size:24px}}
</style></head><body>
<header><h1>Employee Leave Management System</h1><p>Simple and efficient leave administration</p></header><nav><a class="" href="index.html">Dashboard</a><a class="" href="employees.html">Employees</a><a class="" href="leaveTypes.html">Leave Types</a><a class="" href="applyLeave.html">Apply Leave</a><a class="" href="listLeaves.html">Requests</a><a class="" href="approveLeave.html">Approvals</a><a class="active" href="updateLeave.html">Update</a><a class="" href="history.html">History</a></nav><main><section class="card"><h2>Modify Leave Record</h2><p class="sub">Enter the request ID and updated leave details. The employee and status will remain unchanged.</p><div class="form">
<div class="field"><label>Request ID</label><input id="request_id" type="number" placeholder="Request ID"></div><div class="field"><label>Leave Type</label><select id="leave_type_id"><option value="">Select leave type</option></select></div><div class="field"><label>From Date</label><input id="from_date" type="date"></div><div class="field"><label>To Date</label><input id="to_date" type="date"></div><div class="field" style="grid-column:1/-1"><label>Reason</label><textarea id="reason"></textarea></div></div><div class="actions"><button onclick="update()">Update Record</button></div><div id="msg" class="msg"></div></section></main><footer>Employee Leave Management System</footer><script>
const $=id=>document.getElementById(id);function message(t){$('msg').style.display='block';$('msg').textContent=t}
fetch('/leave-types').then(r=>r.json()).then(d=>$('leave_type_id').innerHTML='<option value="">Select leave type</option>'+d.map(x=>`<option value="${x.leave_type_id}">${x.type_name}</option>`).join(''));
async function update(){let id=$('request_id').value,b={leave_type_id:$('leave_type_id').value,from_date:$('from_date').value,to_date:$('to_date').value,reason:$('reason').value.trim()};if(!id||Object.values(b).some(v=>!v))return message('Complete all fields');if(b.to_date<b.from_date)return message('To date cannot be before from date');try{let r=await fetch('/leave-requests/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}),t=await r.text();if(!r.ok)throw Error(t);message(t)}catch(e){message(e.message)}}
</script></body></html>
